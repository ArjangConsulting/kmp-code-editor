name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in sync with release.yml so CI verifies exactly what gets published.
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Use the wrapper so CI builds with the pinned Gradle version rather than the runner's.
      - run: ./gradlew :code-editor:allTests :code-editor:assemble :sample:compileKotlinJvm
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            code-editor/build/reports/tests/
            code-editor/build/test-results/
          retention-days: 14
