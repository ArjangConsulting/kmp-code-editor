name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Bare SemVer tag to build and publish
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      SIGNING_IN_MEMORY_KEY:
        required: true
      SIGNING_IN_MEMORY_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Bare SemVer tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    # Same switch as release-please.yml: a manual dispatch can't publish before releases are enabled.
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: macos-26
    environment: secrets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches manifest version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG_INPUT must be bare SemVer."
            exit 1
          fi
          manifest_version="$(sed -nE 's/.*"\."[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' .release-please-manifest.json | tr -d '[:space:]')"
          if [ "$TAG_INPUT" != "$manifest_version" ]; then
            echo "::error::Tag $TAG_INPUT does not match manifest version $manifest_version."
            exit 1
          fi

      - name: Check
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.tag }}
        run: ./gradlew :code-editor:allTests :code-editor:assemble :sample:compileKotlinJvm --no-configuration-cache

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.tag }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  create-github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
